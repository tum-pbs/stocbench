[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocbench"
version = "0.1.0"
description = "Benchmark of generative one-step forecasting models on deterministic and stochastic Kolmogorov flow."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sebastian Pfister"}]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "hydra-core>=1.3",
    "huggingface_hub>=0.24",
    "matplotlib>=3.7",
    "numpy>=1.26,<2.0",
    "omegaconf>=2.3",
    "pillow>=10",
    "pytorch-lightning>=2.4",
    "pyyaml>=6",
    "rich>=13",
    "seaborn>=0.13",
    "torch>=2.4",
    "torchmetrics>=1.5",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]
solver = ["jax>=0.4", "jaxlib>=0.4", "imageio>=2.35", "imageio-ffmpeg>=0.5", "tqdm>=4"]

[project.urls]
Repository = "https://github.com/tum-pbs/stocbench"

[project.scripts]
stocbench = "stocbench.cli:app"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["stocbench*"]

[tool.setuptools.package-data]
stocbench = ["configs/**/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B905",  # zip() without strict=: the paired sequences are constructed together
    "B008",  # Path(...) defaults in argparse-style signatures
    "E741",  # single-letter math names (l, I) mirror the papers' notation
]

[tool.ruff.lint.per-file-ignores]
"src/stocbench/models/__init__.py" = ["I001"]  # overlay marker blocks keep their own import order
"src/stocbench/models/backbones/__init__.py" = ["I001"]
