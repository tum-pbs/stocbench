rich_progress_bar:
  _target_: pytorch_lightning.callbacks.RichProgressBar

model_checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${hydra:runtime.cwd}/${hydra:run.dir}/checkpoints
  filename: "{epoch:04d}"
  every_n_epochs: 1
  save_top_k: 1
  save_last: false
  save_on_train_epoch_end: true

learning_rate_monitor:
  _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: epoch

ema:
  _target_: stocbench.callbacks.ema.EMA
  decay: 0.999
  validate_original_weights: false
  every_n_steps: 1
  cpu_offload: false
  checkpoint_every_n_epochs: null
  monitor: ${val_monitor}  # per-experiment validation metric (best-ema.ckpt selection)
  mode: min

metrics:
  _target_: ${callback._target_}
  gt_rollout: ${callback.gt_rollout}
  metrics: ${metrics}
  schedule: u:100
  ensemble_size: ${evaluate.ensemble_size}
  rollout_steps: ${evaluate.rollout_steps}
