name_prefix: stoc_  # figures are saved as <name_prefix><figure>
# `steps` selects the largest available budget <= it.

errors:  # one panel per metric vs NFE
  xlabel: NFE
  xlim: [0, 400]
  metrics:
    - {key: mean_error, ylabel: Relative L2 error (mean), ymax: 0.10}
    - {key: std_error, ylabel: Relative L2 error (std), ymax: 0.10}
    - {key: energy_dist, ylabel: Energy distance, ymax: 0.10}
    - {key: enstrophy_error, ylabel: Enstrophy spectrum error, ymax: 40.0}

std_norm:  # L2 norm of the predicted std field vs NFE
  legend: lower right
  axes: {title: Stochastic Kolmogorov flow, xlabel: NFE, xlim: [0, 400], ylabel: L2 error (std), ylim: [25.5, 30]}  # window around the GT norm (29.34)

# r50_* keys: the long-rollout pass (evaluate.long_rollout_steps) at the last budget.
enstr_spec:  # enstrophy spectrum at the final rollout step, with zoom inset
  key: r50_enstrophy_error
  steps: 400
  axes: {xlabel: Wavenumber k, ylabel: Enstrophy, xscale: log, yscale: log}
  inset: {bounds: [0.15, 0.09, 0.50, 0.56], xlim: [5, 13], ylim: [50, 1000]}

enstr_rollout:  # enstrophy spectrum error vs rollout step
  key: r50_enstrophy_error
  steps: 400
  axes: {xlabel: Rollout step, ylabel: Enstrophy spectrum error}

enstr_ratio:  # model/ground-truth enstrophy per wavenumber
  key: r50_enstrophy_error
  steps: 400
  kmax: 40  # the reference enstrophy vanishes beyond this
  axes: {xlabel: Wavenumber k, ylabel: Enstrophy ratio, xscale: log, ylim: [0.5, 2]}

enstr_flow:  # spectrum-over-sampler-steps heatmap, one row per run
  key: r50_enstrophy_error
  steps: 400
  cmap: cubehelix
  k_range: [2, 32]
  gamma: 1.0

seed_fields:  # mean and std maps plus per-method error maps for a few seeds
  seeds: [110, 111, 112]  # seed values, or an int for the N smallest
  steps: 100

schedule:  # mean/std error at each sampler step (metrics with record_steps)
  cmap_range: [0.0, 1.0]  # black (fewest steps) -> hue (most steps)
  minor: {mean: 0.01, std: 0.005}  # gridline spacing
  major: {std: 0.01}
  xlabel: Noise level index
  levels: 100  # CD student sigma grid size

stat_grid:  # model / ground-truth / difference fields per seed
  cols: 2
  max_seeds: 8
